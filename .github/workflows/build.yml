name: Gerar APK Flutter
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa se necessario
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml pubspec.backup.yaml
            flutter create --org com.lfl .
            cp pubspec.backup.yaml pubspec.yaml
            rm -f pubspec.backup.yaml
          fi

      - name: Ajustar versoes do SDK Android para 34
        run: |
          # Corrige ficheiros .gradle tradicionais
          find android -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' {} +
          find android -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} +
          find android -name "build.gradle" -type f -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} +
          find android -name "build.gradle" -type f -exec sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' {} +
          find android -name "build.gradle" -type f -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} +
          find android -name "build.gradle" -type f -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +

          # Corrige ficheiros .gradle.kts modernos
          find android -name "build.gradle.kts" -type f -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} +
          find android -name "build.gradle.kts" -type f -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-LFL-Informatica
          path: build/app/outputs/flutter-apk/app-release.apk
