name: Gerar APK Flutter
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa se necessario
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml pubspec.backup.yaml
            flutter create --org com.lfl .
            cp pubspec.backup.yaml pubspec.yaml
            rm -f pubspec.backup.yaml
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-LFL-Informatica
          path: build/app/outputs/flutter-apk/app-release.apk
