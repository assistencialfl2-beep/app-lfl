name: Gerar APK Flutter
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar estrutura Android
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml pubspec.backup.yaml
            flutter create --org com.lfl .
            cp pubspec.backup.yaml pubspec.yaml
            rm -f pubspec.backup.yaml
          fi

          # Ajustes para build.gradle tradicional (Groovy)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi

          # Ajustes para build.gradle.kts (Kotlin Script)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Limpar e baixar pacotes
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-LFL-Informatica
          path: build/app/outputs/flutter-apk/app-release.apk
