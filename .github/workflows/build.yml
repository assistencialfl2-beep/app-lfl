name: Gerar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias do Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

    - name: Instalar ferramentas Python compativeis
      run: |
        python -m pip install --upgrade pip==23.3.2 setuptools==69.0.0
        pip install "Cython<3.0" virtualenv
        pip install git+https://github.com/kivy/buildozer.git@master
        pip install git+https://github.com/kivy/python-for-android.git@develop

    - name: Criar configuracao buildozer.spec limpa
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = LFL Informatica
        package.name = lfl
        package.domain = com.lfl
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.3.0
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 0
        android.archs = arm64-v8a
        android.ndk = 25b
        android.accept_sdk_license = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Compilar APK
      run: buildozer -v android debug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: App-LFL-Informatica
        path: bin/*.apk
