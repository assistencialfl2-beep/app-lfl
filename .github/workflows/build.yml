name: Gerar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v3
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Instalar ferramentas
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev zip unzip openjdk-17-jdk autoconf libtool
        pip install buildozer cython==0.29.33 virtualenv
    - name: Configurar Receita e Aceitar Termos
      run: |
        buildozer init
        sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/title = My Application/title = LFL Informatica/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = lfl/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.lfl/g' buildozer.spec
    - name: Compilar APK
      run: yes | buildozer -v android debug
    - name: Guardar APK
      uses: actions/upload-artifact@v3
      with:
        name: App-LFL-Informatica
        path: bin/*.apk
