name: Gerar APK Flutter
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inicializar estrutura Android e ajustar SDK 34
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml pubspec.backup.yaml
            flutter create --org com.lfl .
            cp pubspec.backup.yaml pubspec.yaml
            rm -f pubspec.backup.yaml
          fi

          # Ajusta o build.gradle do app para compileSdk 34 e minSdk 21
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' android/app/build.gradle 2>/dev/null || true

          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

          # Forca compileSdk 34 em todos os subprojetos e plugins (corrige o share_plus)
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Baixar pacotes
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-LFL-Informatica
          path: build/app/outputs/flutter-apk/app-release.apk
